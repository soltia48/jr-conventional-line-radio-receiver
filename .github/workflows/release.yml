name: Release

on:
  push:
    tags: ["v*"]
  # Build all archives as Actions artifacts; manual runs never publish a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify manifest and tag versions
        run: node scripts/release.mjs check-version
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: ./.github/actions/setup-native
      # Linux tests already ran in the reusable CI job. Exercise OS-specific
      # paths and native linking on macOS and Windows before packaging.
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Build desktop and CLI
        run: cargo build --release --locked -p jr-receiver-desktop -p jr-receiver
      - name: Package and smoke-test CLI
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/release.mjs package
      - uses: actions/upload-artifact@v7
        with:
          name: jr-receiver-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: jr-receiver-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes dist/*
          fi
