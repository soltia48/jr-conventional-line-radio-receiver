[workspace]
members = ["crates/jr-conventional-dsp", "crates/jr-voice", "crates/receiver-core", "crates/receiver-cli", "crates/demod-eval", "src-tauri"]
default-members = ["crates/receiver-core", "crates/receiver-cli"]
resolver = "2"

[workspace.package]
version = "1.8.0"
authors = ["KIRISHIKI Yudai <yudai.kirishiki@protonmail.com>"]
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
